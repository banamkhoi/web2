<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Profile -dev script</title>
<!-- SEO & Open Graph Meta -->
<meta name="description" content="Trang cá nhân Link Bio hiện đại với phong cách Anime & Gaming.">
<meta property="og:title" content="My Bio Profile">
<meta property="og:description" content="Khám phá các liên kết và thông tin cá nhân của tao.">
<meta property="og:type" content="website">
<!-- Favicon -->
<link rel="icon" href="https://fav.farm/✨" type="image/x-icon">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- STYLES -->
<style>
:root {
--primary-pink: #ff007f;
--neon-purple: #9d4edd;
--neon-cyan: #00f5d4;
--text-color: #ffffff;
--text-dim: rgba(255, 255, 255, 0.7);
--bg-glass: rgba(18, 18, 28, 0.55);
--border-glass: rgba(255, 255, 255, 0.15);
--shadow-glow: 0 0 25px rgba(255, 0, 127, 0.35);
--card-radius: 28px;
--font-main: 'Poppins', sans-serif;
--font-digital: 'Orbitron', sans-serif;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
user-select: none;
}
::-webkit-scrollbar {
width: 6px;
}
::-webkit-scrollbar-track {
background: #0d0d15;
}
::-webkit-scrollbar-thumb {
background: var(--primary-pink);
border-radius: 10px;
}
body {
font-family: var(--font-main);
background-color: #080810;
color: var(--text-color);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow-x: hidden;
position: relative;
padding: 20px;
}
#loader {
position: fixed;
inset: 0;
background: #06060c;
z-index: 9999;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
transition: opacity 0.6s ease, visibility 0.6s;
}
.spinner {
width: 60px;
height: 60px;
border: 4px solid rgba(255, 0, 127, 0.1);
border-left-color: var(--primary-pink);
border-top-color: var(--neon-cyan);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
.loading-text {
margin-top: 15px;
font-family: var(--font-digital);
font-size: 0.85rem;
letter-spacing: 3px;
color: var(--neon-cyan);
}
@keyframes spin {
to { transform: rotate(360deg); }
}
.bg-image {
position: fixed;
inset: -20px;
background-size: cover;
background-position: center;
z-index: -3;
transition: transform 0.1s ease-out;
filter: blur(4px);
}
.bg-overlay {
position: fixed;
inset: 0;
background: radial-gradient(circle at center, rgba(13, 13, 25, 0.4) 0%, rgba(5, 5, 10, 0.85) 100%);
z-index: -2;
}
#particleCanvas {
position: fixed;
inset: 0;
z-index: -1;
pointer-events: none;
}
.cursor-glow {
position: fixed;
width: 350px;
height: 350px;
border-radius: 50%;
background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, rgba(0, 245, 212, 0.05) 50%, transparent 70%);
pointer-events: none;
z-index: 0;
transform: translate(-50%, -50%);
transition: width 0.3s, height 0.3s;
}
.bio-card {
position: relative;
width: 100%;
max-width: 480px;
background: var(--bg-glass);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border-glass);
border-radius: var(--card-radius);
padding: 30px 24px;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), var(--shadow-glow);
overflow: hidden;
z-index: 1;
opacity: 0;
transform: translateY(30px) scale(0.98);
animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
}
@keyframes cardEntrance {
to {
opacity: 1;
transform: translateY(0) scale(1);
}
}
.glass-reflection {
position: absolute;
top: -50%;
left: -50%;
width: 200%;
height: 200%;
background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.05) 45%, transparent 50%);
pointer-events: none;
}
.header-clock {
text-align: center;
margin-bottom: 20px;
}
.date-display {
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 1.5px;
color: var(--neon-cyan);
}
.clock-display {
font-family: var(--font-digital);
font-size: 1.8rem;
font-weight: 700;
color: #ffffff;
text-shadow: 0 0 10px rgba(0, 245, 212, 0.6);
}
.avatar-section {
display: flex;
justify-content: center;
margin-bottom: 16px;
}
.avatar-wrapper {
position: relative;
width: 110px;
height: 110px;
border-radius: 50%;
padding: 4px;
cursor: pointer;
}
.avatar-img {
width: 100%;
height: 100%;
border-radius: 50%;
object-fit: cover;
position: relative;
z-index: 2;
transition: transform 0.4s ease;
}
.avatar-border {
position: absolute;
inset: 0;
border-radius: 50%;
background: conic-gradient(from 0deg, var(--primary-pink), var(--neon-purple), var(--neon-cyan), var(--primary-pink));
animation: rotateGlow 4s linear infinite;
z-index: 1;
}
.avatar-wrapper:hover .avatar-img {
transform: scale(1.06) rotate(3deg);
}
@keyframes rotateGlow {
to { transform: rotate(360deg); }
}
.ripple {
position: absolute;
border-radius: 50%;
background: rgba(255, 0, 127, 0.4);
transform: scale(0);
animation: rippleEffect 0.6s linear;
pointer-events: none;
z-index: 3;
}
@keyframes rippleEffect {
to {
transform: scale(2.5);
opacity: 0;
}
}
.profile-info {
text-align: center;
margin-bottom: 24px;
}
.username {
font-size: 1.4rem;
font-weight: 700;
background: linear-gradient(90deg, #fff, var(--primary-pink));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
.meta-info {
display: flex;
flex-wrap: wrap;
justify-content: center;
align-items: center;
gap: 8px 12px;
font-size: 0.8rem;
color: var(--text-dim);
margin: 6px 0 10px;
}
.status-badge {
display: inline-flex;
align-items: center;
gap: 5px;
background: rgba(255, 255, 255, 0.08);
padding: 3px 10px;
border-radius: 12px;
border: 1px solid rgba(255, 255, 255, 0.1);
}
.pulse-dot {
width: 6px;
height: 6px;
background-color: var(--neon-cyan);
border-radius: 50%;
box-shadow: 0 0 8px var(--neon-cyan);
animation: pulse 1.5s infinite;
}
@keyframes pulse {
50% { opacity: 0.4; }
}
.bio-desc {
font-size: 0.85rem;
color: var(--text-dim);
line-height: 1.4;
}
.music-player {
background: rgba(0, 0, 0, 0.35);
border: 1px solid var(--border-glass);
border-radius: 18px;
padding: 14px;
margin-bottom: 22px;
}
.track-info {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 10px;
}
.cover-art {
width: 48px;
height: 48px;
border-radius: 10px;
object-fit: cover;
box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.track-details {
display: flex;
flex-direction: column;
overflow: hidden;
}
.track-title {
font-size: 0.9rem;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.track-artist {
font-size: 0.75rem;
color: var(--text-dim);
}
.progress-container {
width: 100%;
height: 5px;
background: rgba(255, 255, 255, 0.1);
border-radius: 5px;
cursor: pointer;
position: relative;
overflow: hidden;
}
.progress-bar {
height: 100%;
width: 0%;
background: linear-gradient(90deg, var(--neon-purple), var(--primary-pink));
border-radius: 5px;
transition: width 0.1s linear;
}
.time-display {
display: flex;
justify-content: space-between;
font-size: 0.68rem;
color: var(--text-dim);
margin: 4px 0 8px;
}
.buttons-row {
display: flex;
align-items: center;
justify-content: space-between;
}
.control-btn {
background: none;
border: none;
color: #fff;
font-size: 1rem;
cursor: pointer;
transition: transform 0.2s, color 0.2s;
}
.control-btn:hover {
color: var(--neon-cyan);
transform: scale(1.15);
}
.play-btn {
width: 36px;
height: 36px;
border-radius: 50%;
background: var(--primary-pink);
color: #fff;
display: flex;
justify-content: center;
align-items: center;
box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
}
.play-btn:hover {
transform: scale(1.1);
color: #fff;
background: #ff1a8c;
}
.volume-box {
display: flex;
align-items: center;
gap: 6px;
font-size: 0.8rem;
color: var(--text-dim);
}
.volume-box input[type=range] {
width: 60px;
accent-color: var(--neon-cyan);
cursor: pointer;
}
.social-links {
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 24px;
}
.social-item {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 18px;
background: rgba(255, 255, 255, 0.05);
border: 1px solid var(--border-glass);
border-radius: 16px;
color: #fff;
text-decoration: none;
font-size: 0.9rem;
font-weight: 500;
transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
position: relative;
overflow: hidden;
}
.social-item i {
font-size: 1.2rem;
transition: transform 0.3s ease;
}
.social-item:hover {
background: rgba(255, 0, 127, 0.15);
border-color: var(--primary-pink);
box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
transform: translateY(-3px);
}
.social-item:hover i {
transform: scale(1.2) rotate(-5deg);
color: var(--neon-cyan);
}
.stats-section {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
background: rgba(0, 0, 0, 0.25);
border: 1px solid var(--border-glass);
border-radius: 16px;
padding: 12px 6px;
margin-bottom: 16px;
text-align: center;
}
.stat-box {
display: flex;
flex-direction: column;
align-items: center;
}
.stat-icon {
font-size: 0.85rem;
color: var(--neon-purple);
margin-bottom: 2px;
}
.stat-number {
font-family: var(--font-digital);
font-size: 0.95rem;
font-weight: 700;
color: #fff;
}
.stat-label {
font-size: 0.65rem;
color: var(--text-dim);
text-transform: uppercase;
}
.footer {
text-align: center;
font-size: 0.7rem;
color: rgba(255, 255, 255, 0.3);
}
@media (max-width: 480px) {
.bio-card {
padding: 24px 16px;
}
.clock-display {
font-size: 1.5rem;
}
.stats-section {
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}
}
.enter-overlay {
position: fixed;
inset: 0;
z-index: 500;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
cursor: pointer;
background: rgba(5, 5, 10, 0.45);
backdrop-filter: blur(15px);
-webkit-backdrop-filter: blur(15px);
transition: opacity 0.6s ease, visibility 0.6s;
text-align: center;
}
.enter-overlay.hidden {
opacity: 0;
visibility: hidden;
pointer-events: none;
}
.enter-text {
font-family: var(--font-digital);
font-size: 1.6rem;
letter-spacing: 3px;
color: #fff;
text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
animation: enterPulse 1.8s ease-in-out infinite;
}
.enter-subtext {
margin-top: 8px;
font-size: 0.75rem;
letter-spacing: 2px;
color: rgba(255, 255, 255, 0.6);
text-transform: uppercase;
}
@keyframes enterPulse {
50% { opacity: 0.5; }
}
</style>
</head>
<body>
<div id="loader">
<div class="spinner"></div>

</div>

<div class="enter-text">Click to enter...</div>
<div class="enter-subtext">NHẤN ĐỂ TIẾP TỤC</div>
</div>
<div class="bg-overlay"></div>
<div class="bg-image" id="bgImage"></div>
<canvas id="particleCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>
<main class="bio-card" id="bioCard">
<div class="glass-reflection"></div>
<header class="header-clock">

<section class="avatar-section">

<div class="avatar-border"></div>
</div>
</section>

<div class="meta-info">

<span id="userHometown"><i class="fa-solid fa-house"></i> Vietnam</span>

</div>
<p id="bioText" class="bio-desc">Digital Creator & Gaming Enthusiast</p>
</section>
<section class="music-player">
<div class="track-info">
<img id="musicCover" src="" alt="Album Cover" class="cover-art">
<div class="track-details">
<span id="musicTitle" class="track-title">Title</span>
<span id="musicArtist" class="track-artist">Artist</span>
</div>
</div>
<div class="player-controls">

</div>

<span id="duration">00:00</span>

<div class="buttons-row">

<div class="volume-box">

</section>
<section class="social-links" id="socialLinksContainer">
</section>
<section class="stats-section">
<div class="stat-box">
<i class="fa-solid fa-eye stat-icon"></i>
<span class="stat-number" id="statViews" data-target="0">0</span>
<span class="stat-label">Views</span>
</div>
<div class="stat-box">
<i class="fa-solid fa-heart stat-icon"></i>
<span class="stat-number" id="statLikes" data-target="0">0</span>
<span class="stat-label">Likes</span>
</div>
<div class="stat-box">
<i class="fa-solid fa-users stat-icon"></i>
<span class="stat-number" id="statFollowers" data-target="0">0</span>
<span class="stat-label">Followers</span>
</div>
<div class="stat-box">
<i class="fa-solid fa-star stat-icon"></i>
<span class="stat-number" id="statProjects" data-target="0">0</span>
<span class="stat-label">Projects</span>
</div>
</section>
<footer class="footer">
<p>© 2026 Powered by leminhtuanbao</p>
</footer>
</main>

<!-- SCRIPTS -->
<script>
/* ==========================================================================
👇👇👇 KHU VỰC CHỈNH SỬA THÔNG TIN CỦA BẠN (SỬA Ở ĐÂY) 👇👇👇
========================================================================== */
const CONFIG = {
    // 1. Thông tin cá nhân cơ bản
    username: "@BOMAYYEUVIETNAM", // 👈 SỬA: Tên hiển thị của bạn
    location: "Da Nang, Vietnam", // 👈 SỬA: Nơi bạn đang ở hiện tại
    hometown: "Thanh Hoa, Vietnam", // 👈 SỬA: Quê quán của bạn
    statusText: "Sleeping... 💤", // 👈 SỬA: Dòng trạng thái nhỏ
    bio: "developer script BOMAYYEUVIETNAM Hub", // 👈 SỬA: Câu tiểu sử/giới thiệu

    // 2. Hình ảnh (Thay link ảnh online của bạn vào trong dấu " ")
    avatarUrl: "https://i.ibb.co/4ZdZc0Z3/meme-meo-cong-san.jpg", // 👈 SỬA: Link ảnh đại diện
    bgUrl: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1920&auto=format&fit=crop", // 👈 SỬA: Link ảnh hình nền

    // 3. Nhạc nền (Thay link bài hát MP3 và thông tin)
    music: {
        title: "phép màu", // 👈 SỬA: Tên bài hát
        artist: "Lofi Beats", // 👈 SỬA: Tên ca sĩ / tác giả
        cover: "https://img.youtube.com/vi/HhcTaxixdSI/hqdefault.jpg", // 👈 SỬA: Link ảnh bìa bài hát
        src: "https://raw.githubusercontent.com/banamkhoi/linh-ting/main/Y2Mate.is%20-%20Php%20Mu%20n%20C%20G%20OST%20-%20MAYDAYs%20ft%20Minh%20Tc%20_%20Official%20Lyric%20Video.mp3", // 👈 SỬA: Link file nhạc trực tiếp (.mp3)
        autoPlay: true // 👈 SỬA: Tự động phát nhạc (true: Có, false: Không)
    },

    // 4. Các con số thống kê trên Bio
    stats: {
        views: 14500, // 👈 SỬA: Số Lượt Xem
        likes: 3820, // 👈 SỬA: Số Lượt Thích
        followers: 1290, // 👈 SỬA: Số Người Theo Dõi
        projects: 48 // 👈 SỬA: Số Dự Án
    },

    // 5. Các liên kết mạng xã hội (Thêm, xóa hoặc sửa link tại đây)
    socials: [
        { name: "Sever Discord", icon: "fab fa-discord", url: "https://discord.gg/T5JCKm8rm" }, // 👈 SỬA LINK DISCORD
        { name: "Facebook", icon: "fab fa-facebook", url: "https://facebook.com/HOCHIMINHMUONNAM.1975" }, // 👈 SỬA LINK FACEBOOK
        { name: "GitHub", icon: "fab fa-github", url: "https://github.com/banamkhoi" }, // 👈 SỬA LINK GITHUB
        { name: "TikTok", icon: "fab fa-tiktok", url: "https://tiktok.com/@bomayyeuvietnam_205" }, // 👈 SỬA LINK TIKTOK
        { name: "YouTube", icon: "fab fa-youtube", url: "https://youtube.com/@bomayyeuvietnamyt" } // 👈 SỬA LINK YOUTUBE
    ]
};
/* ==========================================================================
👆👆👆 HẾT KHU VỰC CHỈNH SỬA (BÊN DƯỚI LÀ CODE XỬ LÝ HỆ THỐNG) 👆👆👆
========================================================================== */

document.addEventListener("DOMContentLoaded", () => {
    initUI();
    initClock();
    initMusicPlayer();
    initParticles();
    initEffects();

    window.addEventListener("load", () => {
        const loader = document.getElementById("loader");
        loader.style.opacity = "0";
        setTimeout(() => {
            loader.style.visibility = "hidden";
            startStatsCounter();
        }, 600);
    });
});

function initUI() {
    document.getElementById("bgImage").style.backgroundImage = `url('${CONFIG.bgUrl}')`;
    document.getElementById("userAvatar").src = CONFIG.avatarUrl;
    document.getElementById("username").textContent = CONFIG.username;
    document.getElementById("userLocation").innerHTML = `<i class="fa-solid fa-location-dot"></i> ${CONFIG.location}`;
    document.getElementById("userHometown").innerHTML = `<i class="fa-solid fa-house"></i> Quê: ${CONFIG.hometown}`;
    document.getElementById("statusText").textContent = CONFIG.statusText;
    document.getElementById("bioText").textContent = CONFIG.bio;

    const container = document.getElementById("socialLinksContainer");
    container.innerHTML = CONFIG.socials.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="social-item">
            <span>${item.name}</span>
            <i class="${item.icon}"></i>
        </a>
    `).join('');

    document.getElementById("statViews").setAttribute("data-target", CONFIG.stats.views);
    document.getElementById("statLikes").setAttribute("data-target", CONFIG.stats.likes);
    document.getElementById("statFollowers").setAttribute("data-target", CONFIG.stats.followers);
    document.getElementById("statProjects").setAttribute("data-target", CONFIG.stats.projects);
}

function initClock() {
    const clockEl = document.getElementById("clockText");
    const dateEl = document.getElementById("dateText");
    const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

    function update() {
        const now = new Date();
        const dayName = days[now.getDay()];
        const dateStr = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getFullYear()}`;
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        dateEl.textContent = `${dayName} - ${dateStr}`;
        clockEl.textContent = `${hours}:${minutes}:${seconds}`;
    }
    update();
    setInterval(update, 1000);
}

/* ==========================================================================
🎵 TRÌNH PHÁT NHẠC - GẮN VỚI MÀN HÌNH "CLICK TO ENTER"
   Trình duyệt không cho phát nhạc có tiếng khi chưa có tương tác của
   người dùng, nên màn hình "Click to enter..." (nền blur) chính là cử
   chỉ đó: người dùng bấm vào overlay -> overlay biến mất, web hết blur,
   VÀ ngay trong cùng lần click đó nhạc được phát có tiếng luôn (vì đây
   là một user gesture hợp lệ nên trình duyệt luôn cho phép).
========================================================================== */
function initMusicPlayer() {
    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const progressBar = document.getElementById("progressBar");
    const progressContainer = document.getElementById("progressContainer");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volumeSlider = document.getElementById("volumeSlider");
    const enterOverlay = document.getElementById("enterOverlay");

    document.getElementById("musicCover").src = CONFIG.music.cover;
    document.getElementById("musicTitle").textContent = CONFIG.music.title;
    document.getElementById("musicArtist").textContent = CONFIG.music.artist;

    audio.src = CONFIG.music.src;
    audio.volume = volumeSlider.value;
    audio.loop = true;
    audio.playsInline = true; // để hoạt động tốt trên Safari/iOS

    let isPlaying = false;

    function setPlayingUI(playing) {
        isPlaying = playing;
        playIcon.className = playing ? "fa-solid fa-pause" : "fa-solid fa-play";
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
        } else {
            audio.pause();
            setPlayingUI(false);
        }
    }

    playBtn.addEventListener("click", togglePlay);

    const autoPlayEnabled = CONFIG.music.autoPlay === true || CONFIG.music.autoPlay === "true";

    if (enterOverlay) {
        enterOverlay.addEventListener("click", () => {
            // 1) Ẩn overlay -> web hết blur, hiện bình thường
            enterOverlay.classList.add("hidden");
            setTimeout(() => enterOverlay.remove(), 700);

            // 2) Click này được tính là "click to enter" -> phát nhạc có tiếng ngay
            if (autoPlayEnabled) {
                audio.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
            }
        }, { once: true });
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    audio.addEventListener("timeupdate", () => {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${progress}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
    });

    progressContainer.addEventListener("click", (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    });

    volumeSlider.addEventListener("input", (e) => {
        audio.volume = e.target.value;
    });
}

function startStatsCounter() {
    const counters = document.querySelectorAll('.stat-number');
    const speed = 200;

    counters.forEach(counter => {
        const target = +counter.getAttribute('data-target');
        let count = 0;
        const inc = target / speed;

        const updateCount = () => {
            count += inc;
            if (count < target) {
                counter.innerText = Math.ceil(count).toLocaleString();
                setTimeout(updateCount, 15);
            } else {
                counter.innerText = target.toLocaleString();
            }
        };
        updateCount();
    });
}

function initParticles() {
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = -Math.random() * 0.6 - 0.2;
            this.alpha = Math.random() * 0.6 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.y < 0) {
                this.y = canvas.height;
                this.x = Math.random() * canvas.width;
            }
        }
        draw() {
            ctx.fillStyle = `rgba(255, 0, 127, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 45; i++) {
        particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();
}

function initEffects() {
    const cursorGlow = document.getElementById("cursorGlow");
    const bgImage = document.getElementById("bgImage");
    const bioCard = document.getElementById("bioCard");
    const avatarWrapper = document.getElementById("avatarWrapper");

    document.addEventListener("mousemove", (e) => {
        const { clientX, clientY } = e;
        cursorGlow.style.left = `${clientX}px`;
        cursorGlow.style.top = `${clientY}px`;

        const moveX = (clientX - window.innerWidth / 2) * 0.015;
        const moveY = (clientY - window.innerHeight / 2) * 0.015;
        bgImage.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        bioCard.style.transform = `translate(${moveX * 0.5}px, ${moveY * 0.5}px)`;
    });

    avatarWrapper.addEventListener("click", function (e) {
        const circle = document.createElement("span");
        circle.classList.add("ripple");
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        circle.style.width = circle.style.height = `${size}px`;
        circle.style.left = `${e.clientX - rect.left - size / 2}px`;
        circle.style.top = `${e.clientY - rect.top - size / 2}px`;
        this.appendChild(circle);
        setTimeout(() => circle.remove(), 600);
    });
}
</script>
